# Local development stack: RAG API + PostgreSQL with pgvector.
#   docker compose up --build
# Provider settings (Azure OpenAI, Ollama, ...) are read from .env if present; defaults run offline.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag  # local development only
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      RAG_VECTOR_STORE: pgvector
      RAG_DATABASE_URL: postgresql://rag:rag@db:5432/rag
    ports:
      - "127.0.0.1:8000:8000"

  # Optional local models: docker compose --profile ollama up
  # then set RAG_OPENAI_BASE_URL=http://ollama:11434/v1 and RAG_LLM_PROVIDER=openai in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
